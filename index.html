lass="mini">THE PRIVATE ESCAPE</span><span class="no">03</span><h3>隐世假期 · 自成一境</h3><p>从白马庄园到丽思卡尔顿隐世，为海湾、山野与两人时光留白。</p><span class="arrow">↗</span></button></div><p class="fineprint">${note} 名录按中国内地及港澳的 60 家与海外 60 家划分。情境中的礼宾、私宴与活动为旅行意向，具体安排需向酒店确认。</p></section>`}
function chips(type,items,value){return items.map(([v,l])=>`<button class="chip ${String(v)===String(value)?'active':''}" data-config="${type}" data-value="${esc(v)}">${l}</button>`).join('')}
function renderSetup(){app.innerHTML=`<section class="page"><div class="setup"><div class="setup-story"><div class="eyebrow">YOUR PRIVATE TRAVEL BRIEF</div><h1>先为这趟旅程，<br>留出合适的尺度。</h1><p>接下来，你将面对十二个真实的取舍：会客的分寸、晚宴的重心，以及门关上之后的自己。</p><div class="setup-list"><span><b>01</b>设定地域与每晚规划预算</span><span><b>02</b>完成十二幕情境，约 4–6 分钟</span><span><b>03</b>收下酒店、馆内晚宴与行程建议</span></div></div><div class="form-card"><h3>你的行程简报</h3><label class="field-label">这一次，你愿意去哪里？</label><div class="segmented">${chips('scope',[['全部','全球甄选'],['国内','中国 · 60 家'],['世界','海外 · 60 家']],config.scope)}</div><label class="field-label">每晚参考预算上限 · 人民币</label><div class="segmented">${chips('budget',[[3000,'¥1,500–3,000'],[6000,'¥6,000 以内'],[12000,'¥12,000 以内'],[30000,'¥30,000 以内'],[999999,'预算从容']],config.budget)}</div><p class="fineprint">按可核实的人民币参考起价筛选；缺少报价时仍会给出酒店建议，并提醒你确认周末价格。</p><button class="primary" id="start">进入第一幕 <span>→</span></button>${answers.length?`<button class="text-btn" id="resume" style="margin-top:18px">继续上次的甄选 · 已答 ${answeredCount()}/12</button>`:''}</div></div></section>`}
function profile(){const p={};Object.keys(T).forEach(k=>{p[k]=0});answers.forEach((a,i)=>{const option=Number.isInteger(a)&&Q[i]&&Q[i].options[a],w=option&&option.weights||{};Object.keys(w).forEach(k=>{if(k in p)p[k]+=w[k]})});return p}
function topTaste(p=profile()){return Object.keys(p).sort((a,b)=>p[b]-p[a]).filter(k=>p[k]>0).slice(0,3)}
function renderQuiz(){const q=Q[step];if(!q){toast('情境资料正在准备');go('home');return}const selected=Number.isInteger(answers[step])?answers[step]:undefined;const displayed=questionDraw(step);const taste=topTaste();app.innerHTML=`<section class="page"><div class="quiz-grid"><div><div class="progress-top"><span>YOUR PRIVATE JOURNEY</span><span><strong>${String(step+1).padStart(2,'0')}</strong> / ${Q.length}</span></div><div class="progress"><div style="width:${((step+1)/Q.length)*100}%"></div></div><div class="question"><div class="eyebrow">${esc(q.kicker)}</div><h1>${esc(q.title)}</h1><p class="scene">${esc(q.scene)}</p><div class="option-toolbar"><span>本幕从 ${q.options.length} 种选择中抽取 4 种</span><button class="text-btn" id="reroll-options">换一组 ↻</button></div><div class="options">${displayed.map((i,slot)=>{const o=q.options[i];return `<button class="option ${selected===i?'selected':''}" data-answer="${i}" aria-pressed="${selected===i}"><span class="letter">${String.fromCharCode(65+slot)}</span><span><strong>${esc(o.label)}</strong><p>${esc(o.detail)}</p></span></button>`}).join('')}</div><div class="quiz-actions"><button class="text-btn" id="previous">← ${step?'上一幕':'行程设定'}</button><button class="primary" id="next" ${selected===undefined?'disabled':''}>${step===Q.length-1?'揭晓私人甄选':'进入下一幕'} <span>→</span></button></div></div></div><aside class="brief"><div class="eyebrow">THE CONCIERGE NOTES</div><h3>Your travel dossier.</h3><div class="brief-name">品位，藏在每个取舍里。</div><p>每一道选择都会改变酒店的匹配顺序。将直觉交给自己，把细节交给这份甄选。</p><div class="brief-row"><span>目的地范围</span><b>${config.scope==='全部'?'全球甄选':config.scope==='国内'?'中国内地及港澳':'海外甄选'}</b></div><div class="brief-row"><span>每晚预算</span><b>${budgetLabel(config.budget)}</b></div><div class="brief-row"><span>已完成</span><b>${answeredCount()} / ${Q.length} 幕</b></div><div class="taste-pills">${taste.map(t=>`<span>${T[t]}</span>`).join('')}</div>${q.word?`<div class="glossary"><div class="eyebrow" style="font-size:8px">THE PRIVATE LEXICON</div><strong>${esc(q.word.term)}</strong><p>${esc(q.word.meaning)}</p></div>`:''}<button class="text-btn" data-go="home" style="margin-top:25px">保存进度，稍后继续 ↗</button></aside></div></section>`}
function rankHotels(){
  const p=profile(),open=H.filter(h=>!h.availabilityNote||!h.availabilityNote.includes('营业季外'));let pool=open.filter(h=>config.scope==='全部'||h.region===config.scope);matchNotice='';
  if(!pool.length)pool=open.length?open.slice():H.slice();
  if(config.budget!==999999){
    const within=pool.filter(h=>priceValue(h)!==null&&priceValue(h)<=config.budget);
    if(within.length)pool=within;
    else {const pending=pool.filter(h=>priceValue(h)===null);if(pending.length){pool=pending;matchNotice='当前未取得符合预算的可复核周末报价，以下先按旅行偏好推荐；房价请按入住日期确认。'}else{matchNotice='当前已查参考价均高于预算，以下保留偏好最合适的酒店作为备选，并列出价格供你比较。'}}
  }
  return pool.map(h=>({h,score:h.tags.reduce((n,t)=>n+(p[t]||0),0)/Math.sqrt(h.tags.length||1)})).sort((a,b)=>b.score-a.score||(priceValue(a.h)||Number.MAX_VALUE)-(priceValue(b.h)||Number.MAX_VALUE));
}
function details(h){return `<div class="hotel-deep"><div class="eyebrow">A CLOSER LOOK</div><h3>这个地址的细节</h3><div class="highlights">${(h.highlights||[h.signature,S[h.setting],T[h.tags[0]]]).map((s,i)=>`<div><span>0${i+1}</span><p>${esc(s)}</p></div>`).join('')}</div><div class="detail-notes"><div><small>THE OCCASION · 适合此刻</small><p>${esc(h.bestFor||h.tags.slice(0,3).map(t=>T[t]).join(' · '))}</p></div><div><small>THE ROOM · 选房建议</small><p>${esc(h.roomTip||'按同行人数与行程重心比较房型，并向酒店确认景观、布局及所需设施。')}</p></div><div><small>THE RHYTHM · 停留节奏</small><p>${esc(h.stayLength||'建议 2 晚，留出完整一天体验酒店与周边。')}</p></div></div></div>`}
function card(h){return `<article class="hotel-card" data-hotel="${h.id}" tabindex="0" role="button" aria-label="查看${esc(h.name)}"><div class="card-top"><span class="location">${esc(h.country)} · ${esc(h.city)}</span><button class="save" data-save="${h.id}" aria-label="${saved.includes(h.id)?'取消收藏':'收藏酒店'}">${saved.includes(h.id)?'◆':'◇'}</button></div><div class="hotel-en">${esc(h.en)}</div><h3>${esc(h.name)}</h3><p class="description">${esc(h.blurb)}</p><div class="card-tags"><span class="tag">${S[h.setting]||'私享旅居'}</span>${h.tags.slice(0,2).map(t=>`<span class="tag">${T[t]||t}</span>`).join('')}</div><div class="card-bottom">${priceMarkup(h)}<span class="arrow">↗</span></div><div class="restaurant-line"><span>馆内餐厅</span>${esc(h.dining)}</div></article>`}
function renderResult(){if(!isComplete()){step=Math.max(0,Q.findIndex((q,i)=>!Number.isInteger(answers[i])||!q.options[answers[i]]));go('quiz');return}const ranked=rankHotels();lastResults=ranked;const first=ranked[0];if(!first){app.innerHTML=`<section class="page"><div class="empty"><h3>请为旅程调整一点空间</h3><p>当前地域与预算组合暂无酒店，调整行程设定后继续。</p><button class="primary" data-go="setup">调整设定</button></div></section>`;return}const h=first.h,p=profile(),taste=topTaste(p),matches=h.tags.filter(t=>p[t]>0).sort((a,b)=>p[b]-p[a]).slice(0,3),alternates=ranked.filter(x=>x.h.id!==h.id&&x.h.brand!==h.brand).slice(0,2);app.innerHTML=`<section class="page"><div class="result-cover"><div class="eyebrow">YOUR ADDRESS, CONSIDERED</div><h1>这一次，${esc(h.city)}等你入席。</h1><p>十二幕选择，汇成一份私人行程。${taste.map(t=>T[t]).join(' · ')}</p></div>${matchNotice?`<p class="match-notice" role="status">${esc(matchNotice)}</p>`:''}<div class="result-layout"><div class="result-art"><div class="seal">YOUR FIRST CHOICE<br><span style="font-size:34px;letter-spacing:0">01 / ${ranked.length}</span></div><div class="result-art-caption">空间灵感 · Aman New York / 图片：MICHELIN Guide<br>所选酒店资料与餐饮详情见右侧及官网</div></div><div class="result-body"><div class="eyebrow">${esc(h.country)} · ${esc(h.city)}</div><div class="hotel-en">${esc(h.en)}</div><h2>${esc(h.name)}</h2><p class="result-desc">${esc(h.blurb)}</p><div class="taste-pills">${matches.map(t=>`<span>${T[t]}</span>`).join('')}</div><div class="reason">你的选择偏向${matches.map(t=>T[t]).join('、')}。${esc(h.signature)}，与这趟旅程的重心相合。</div>${priceMarkup(h)}${priceDetails(h)}<div><button class="primary" data-save="${h.id}" style="letter-spacing:1px">${saved.includes(h.id)?'◆':'◇'}</button><button class="text-btn" data-hotel="${h.id}">查看酒店与餐饮详情 ↗</button></div></div></div>${details(h)}<div class="dining-card"><div class="dining-symbol">D.</div><div><div class="eyebrow" style="font-size:8px">YOUR EVENING, RESERVED IN SPIRIT</div><h3>${esc(h.dining)}</h3><p>${esc(h.cuisine)} · ${esc(h.diningExperience||h.diningNote)}</p><p class="dining-budget">餐饮按当日菜单计价 · 酒水与税费请另核</p></div><a href="${esc(h.source)}" target="_blank" rel="noopener" class="text-btn">酒店餐饮官网 ↗</a></div><div class="section-head" style="margin-top:40px"><h2 style="font-size:23px">三段时光，一份留白。</h2><button class="text-btn" id="copy-plan">复制私人行程 ↗</button></div><div class="itinerary"><div><h4>15:00 · Arrival</h4><p>抵达${esc(h.name)}。先整理行程，再留出一段属于${T[taste[0]]||'休息'}的时间。</p></div><div><h4>19:00 · The Table</h4><p>将 ${esc(h.dining)} 作为晚宴首选，向礼宾确认营业日、菜单与合适的桌席。</p></div><div><h4>09:00 · Slow Morning</h4><p>从容早餐，沿${h.setting==='city'?'城市街区':h.setting==='island'||h.setting==='sea'?'海岸':h.setting==='mountain'?'山间步道':'酒店周边'}散步。为下一段行程留出余裕。</p></div></div><div class="result-secondary"><div class="section-head"><div><div class="eyebrow">TWO MORE WAYS TO ARRIVE</div><h2>同一份品位，另两种表达。</h2></div><button class="text-btn" data-go="setup">重新甄选 ↻</button></div><div class="hotel-grid">${alternates.map(x=>card(x.h)).join('')}</div></div><p class="fineprint">${note} 餐厅价格需按当日菜单与酒水选择核实。匹配以所答偏好与酒店标签进行排序。</p></section>`}
function renderAtlas(onlySaved=false){const brands=[...new Set(H.map(h=>h.brand))].sort();app.innerHTML=`<section class="page"><div class="page-top"><div><div class="eyebrow">${onlySaved?'YOUR PRIVATE COLLECTION':'THE COMPLETE COLLECTION'}</div><h1 class="page-title">${onlySaved?'我的私人名录':'一百二十个，值得抵达的地址。'}</h1><p>${onlySaved?'把心动的地址留在这里，下一次从容出发。':'中国 60 家 · 海外 60 家 · 每一家均附馆内餐饮官网'}</p></div><button class="text-btn" data-go="setup">让情境为你甄选 ↗</button></div><div class="atlas-tools"><input id="search" class="search" type="search" placeholder="搜索酒店、城市、品牌或餐厅…" aria-label="搜索酒店" value="${esc(filter.query)}"><select id="scope-filter" aria-label="地域"><option>全部</option><option ${filter.scope==='国内'?'selected':''}>国内</option><option ${filter.scope==='世界'?'selected':''}>世界</option></select><select id="brand-filter" aria-label="品牌"><option>全部品牌</option>${brands.map(b=>`<option ${filter.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select><select id="setting-filter" aria-label="环境"><option value="全部环境">全部环境</option>${Object.entries(S).map(([v,l])=>`<option value="${v}" ${filter.setting===v?'selected':''}>${l}</option>`).join('')}</select><select id="sort-filter" aria-label="排序"><option value="curated">甄选顺序</option><option value="asc" ${filter.sort==='asc'?'selected':''}>预算由低到高</option><option value="desc" ${filter.sort==='desc'?'selected':''}>预算由高到低</option></select></div><p id="atlas-count" style="font-size:11px;color:var(--muted)"></p><div class="hotel-grid" id="atlas-grid"></div><p class="fineprint">${note} 名录按奢华酒店定位收录，实际基础房价格可能低于 ¥1,500；已撤下原先统一估算的预算档。中国名录含中国内地及港澳。</p></section>`;updateAtlasGrid(onlySaved);document.getElementById('search').addEventListener('input',e=>{filter.query=e.target.value;updateAtlasGrid(onlySaved)});[['scope-filter','scope'],['brand-filter','brand'],['setting-filter','setting'],['sort-filter','sort']].forEach(([id,k])=>document.getElementById(id).addEventListener('change',e=>{filter[k]=e.target.value;updateAtlasGrid(onlySaved)}))}
function updateAtlasGrid(onlySaved=false){let list=H.filter(h=>(!onlySaved||saved.includes(h.id))&&(filter.scope==='全部'||h.region===filter.scope)&&(filter.brand==='全部品牌'||h.brand===filter.brand)&&(filter.setting==='全部环境'||h.setting===filter.setting)&&[h.name,h.en,h.city,h.country,h.brand,h.dining].join(' ').toLowerCase().includes(filter.query.toLowerCase()));if(filter.sort!=='curated')list.sort((a,b)=>{const av=priceValue(a),bv=priceValue(b);if(av===null)return bv===null?0:1;if(bv===null)return -1;return filter.sort==='asc'?av-bv:bv-av});document.getElementById('atlas-count').textContent=`${list.length} 个地址 · ${list.filter(h=>h.region==='国内').length} 家中国酒店 / ${list.filter(h=>h.region==='世界').length} 家海外酒店`;document.getElementById('atlas-grid').innerHTML=list.length?list.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><h3>${onlySaved&&!saved.length?'你的第一间心动酒店，尚待入藏。':'为搜索留一点余地。'}</h3><p>${onlySaved&&!saved.length?'浏览名录，点击菱形即可收藏。':'试试其他城市、品牌或环境组合。'}</p><button class="text-btn" id="clear-filters">清空筛选${onlySaved?'并浏览名录':''} →</button></div>`}

 if(b.mode==='passport')return `<div class="sealed-letter"><span>PERSONAL & CONFIDENTIAL</span><div class="wax-seal">GT</div><p>一段三天的私人行程<br>收件人：接下来的你</p></div><div class="identity-grid">${options.map(o=>choiceMarkup(o)).join('')}</div>`;
 if(b.mode==='lobby'||b.mode==='map')return `<div class="explore-scene ${b.mode}">${roomIllustration(b.mode==='map')}<div class="explore-label">${b.mode==='map'?'情境地图 · 方位示意':'空间勘景 · 场景示意'}</div>${options.map((x,i)=>`<button class="scene-pin pin-${i} ${journey.selected===x.index?'selected':''}" data-jaction="select" data-option="${x.index}" aria-label="探索${esc(x.o.label)}"><b>0${i+1}</b><span>${esc(x.o.label)}</span></button>`).join('')}</div><div class="explore-caption"><small>${selection?'你正在查看':'点亮一个坐标'}</small><h3>${selection?esc(selection.label):b.mode==='lobby'?'找一个让你安定下来的细节。':'从这张地图，走进自己的午后。'}</h3><p>${selection?esc(selection.detail):'点击场景中的光点，展开这一站，再把喜欢的安排记入行程。'}</p></div>`;
 if(b.mode==='schedule')return `<div class="schedule-help"><span>90 MINUTES / 三格，每格 30 分钟</span><button class="text-btn" data-jaction="draft">礼宾排一版 ↗</button></div><div class="schedule-tasks">${options.map(x=>`<button draggable="true" class="task-card ${journey.pendingTask===x.index?'active':''}" data-task="${x.index}" data-jaction="task" data-option="${x.index}"><span>30′</span><strong>${esc(x.o.label)}</strong><small>${T[journeyTag(x.o)]}</small></button>`).join('')}<button draggable="true" class="task-card rest ${journey.pendingTask===-1?'active':''}" data-task="-1" data-jaction="task" data-option="-1"><span>30′</span><strong>留一格空白</strong><small>休息，先不做安排</small></button></div><div class="schedule-slots">${journey.schedule.map((id,i)=>`<button class="schedule-slot ${id!==null?'filled':''}" data-slot="${i}" data-jaction="slot"><time>${['16:00—16:30','16:30—17:00','17:00—17:30'][i]}</time><strong>${id===null?'＋ 放入一段时间':id===-1?'◌ 留白':esc(Q[journey.step].options[id].label)}</strong><small>${id===null?'点一张卡，再点这里；电脑可拖入':'点击可替换；同一活动可移动换位'}</small></button>`).join('')}</div><p class="interaction-hint">三格里至少留一个活动。拖动或点选都可以，真正需要取舍的是你的时间。</p>`;
 if(b.mode==='seating')return `<div class="dinner-scene"><div class="dinner-table"><span>THE PRIVATE TABLE</span><div class="place-setting">◯ <i>✧</i> ◯</div><b>YOUR SEAT</b></div>${[0,1].map(i=>`<div class="guest-seat seat-${i}"><span>${i?'右手边':'左手边'}</span><strong>${Number.isInteger(journey.guests[i])?esc(Q[journey.step].options[journey.guests[i]].label):'空出的座位'}</strong></div>`).join('')}</div><div class="guest-list">${options.map(x=>`<button class="guest-card ${journey.guests.includes(x.index)?'selected':''}" data-jaction="guest" data-option="${x.index}" aria-pressed="${journey.guests.includes(x.index)}"><span>${journey.guests.includes(x.index)?'✓':'＋'}</span><strong>${esc(x.o.label)}</strong><small>${esc(x.o.detail)}</small></button>`).join('')}</div><p class="interaction-hint">餐桌只留下两席。点击来宾安排座位，再点一次即可收回邀请。</p>`;
 if(b.mode==='chat'||b.mode==='call')return `<div class="story-phone"><div class="phone-top"><span class="presence-dot"></span><b>${b.mode==='call'?'合作伙伴 · 临时来电':'NINA · 私人礼宾'}</b><small>剧情通讯 · 模拟</small></div>${b.mode==='call'?`<div class="call-banner"><span class="call-orbit">☎</span><strong>一通三十分钟的电话。</strong><span id="journey-call-clock">你可以从容调整安排</span></div>`:''}<div class="message received"><small>${b.actor}</small>${esc(b.mode==='call'?'现在方便聊一会吗？有个问题想听听你的判断。':conciergeNote())}</div><div class="message received">${b.mode==='call'?'同行的人还在等你，原定的预约也可以重排。你希望怎样接住这个插曲？':'今晚的行程已经慢下来了。剩下这段夜色，你想怎样度过？'}</div>${selection?`<div class="message sent">${esc(selection.label)}<p>${esc(selection.detail)}</p></div>`:'<div class="message waiting">下方选一条回复，先看看它会怎样落进故事。</div>'}</div><div class="reply-grid">${options.map(x=>`<button class="reply-chip ${journey.selected===x.index?'selected':''}" data-jaction="select" data-option="${x.index}">${esc(x.o.label)}</button>`).join('')}</div>`;
 if(['ritual','envelope','postcard','menu'].includes(b.mode)){const labels={ritual:['MORNING NOTE','清晨来信'],envelope:['A PRIVATE INVITATION','写给你的邀请'],postcard:['A MOMENT TO KEEP','一张未写完的明信片'],menu:['THE EVENING EDIT','一份尚未展开的菜单']};const pair=labels[b.mode];const lead=b.mode==='menu'?rankHotels()[0]:null;return `${lead?`<div class="dining-preview"><span>馆内餐饮参考</span><strong>${esc(lead.h.dining)}</strong><p>${esc(lead.h.name)} · ${esc(lead.h.cuisine)}</p><small>最终酒店会随完整行程确定；下方选择的是你的晚宴风格。</small></div>`:''}<div class="reveal-grid ${b.mode}">${options.map((x,i)=>`<article class="reveal-card ${opened.includes(x.index)?'opened':''} ${journey.selected===x.index?'selected':''}">${opened.includes(x.index)?`<small>${T[journeyTag(x.o)]} · 0${i+1}</small><h3>${esc(x.o.label)}</h3><p>${esc(x.o.detail)}</p><button class="text-btn" data-jaction="select" data-option="${x.index}">${journey.selected===x.index?'✓ 已记在心里':'留下这一刻 →'}</button>`:`<button class="reveal-front" data-jaction="reveal" data-option="${x.index}" aria-label="翻开第${i+1}${b.mode==='envelope'?'封邀请':'张卡片'}"><small>${pair[0]}</small><span>${b.mode==='envelope'?'✉':b.mode==='menu'?'D.':'◈'}</span><strong>${pair[1]} · 0${i+1}</strong><i>轻触展开</i></button>`}</article>`).join('')}</div><p class="interaction-hint">${b.mode==='ritual'?'至少翻开两张清晨卡，再选一张写入日程。':b.mode==='envelope'?'拆开邀请，看看里面的约定，再决定把下午留给谁。':b.mode==='menu'?'翻开菜单卡，为晚宴定下风格。具体餐厅与菜单会随最终酒店一同呈现。':'翻看这些片刻，留下一张属于你的记忆。'}</p>`}
 return `<div class="journal-paper"><small>THREE DAYS, IN YOUR WORDS</small><label for="journey-title">给这段行程起一个名字</label><input id="journey-title" maxlength="24" value="${esc(journey.title)}" placeholder="例如：收盘之后，听一晚海风"><p>写下一句会让你想起这三天的话，也可以留白，交给旅程自己命名。</p></div><div class="memory-choices">${options.map(x=>choiceMarkup(x,'memory')).join('')}</div>`;
}
function canCommitJourney(){if(!journey)return false;const b=BEATS[journey.step];if(b.mode==='schedule')return journey.schedule.every(id=>id!==null)&&journey.schedule.some(id=>id>=0);if(b.mode==='seating')return journey.guests.length===2;if(b.mode==='ritual'&&storyRead(journey.step).length<2)return false;return Number.isInteger(journey.selected)&&!!Q[journey.step].options[journey.selected]}
function commitCaption(){const m=BEATS[journey.step].mode;return {passport:'签收这份行程',lobby:'把这个细节记入简报',schedule:'确认这九十分钟',map:'就去这一站',seating:'请两位入席',chat:'发给礼宾',ritual:'带着这一刻开始今天',envelope:'把这场邀约写入日程',call:'这样接住这通电话',menu:'为晚宴定下风格',postcard:'收藏这一张明信片',journal:'封存手札，揭晓酒店'}[m]}
function aftermath(){const n=journey.step,record=journey.log[n],option=Q[n].options[journey.picks[n]],tag=journeyTag(option),line=STORY_REPLIES[tag][1],stats=journeyStats();return `<div class="aftermath"><div class="aftermath-seal">✓</div><small>WRITTEN INTO YOUR JOURNEY</small><h2>${esc(record.label)}</h2><div class="message received"><small>NINA · 行程札记</small>${esc(line)}${BEATS[n].mode==='schedule'&&journey.schedule.includes(-1)?'<p>你特意留出的空白，也为这一天找回了一点精力。</p>':''}</div><div class="aftermath-effect"><span>${T[tag]}，成为新的甄选线索</span><strong>${journeyCount()} / 12 个片刻已写入</strong></div><div class="next-scene-preview"><span>${n<11?'NEXT CHAPTER':'YOUR HOTEL AWAITS'}</span><h3>${n<11?'DAY 0'+BEATS[n+1].day+' · '+BEATS[n+1].time+' '+BEATS[n+1].caption:'三天的行程，终于指向一个地址。'}</h3><p>${n===5?'一枚抵达印章已经留在手札里。下一幕，从清晨开始。':n===9?'重要的事已经放好，第三天留给回味。':'行程会继续记住你的取舍。'}</p></div><button class="primary" data-jaction="continue">${n===11?'揭晓酒店与晚宴':'走进下一个片刻'} <span>→</span></button><button class="text-btn" data-jaction="edit">回看这一幕</button>${journeyCount()===12&&n<11?'<button class="text-btn" data-jaction="return-result">回到更新后的手札 ↗</button>':''}</div>`}
function renderJourney(){clearStoryClock();if(!journey)return;step=journey.step;answers=journey.picks.slice();const b=BEATS[step],q=Q[step];if(!b||!q){go('journey-setup');return}document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.view==='home'));app.innerHTML=`<section class="journey-shell">${journeyRail()}<div class="journey-main"><div class="journey-topline"><span>DAY 0${b.day} <b>·</b> ${b.time}</span><button class="sound-button ${ambience?'active':''}" data-jaction="sound" aria-pressed="${!!ambience}">${ambience?'♫ 关闭氛围音':'♪ 开启氛围音'}</button></div><div class="journey-progress"><i style="width:${journeyCount()/12*100}%"></i></div>${journey.phase==='aftermath'?aftermath():`<div class="scene-heading"><div class="eyebrow">${b.mark}</div><h1>${b.title}</h1><p>${esc(q.scene)}</p></div><div class="story-module ${b.mode}">${currentModule()}</div><div class="journey-actions"><button class="text-btn" data-jaction="redraw">${b.mode==='envelope'?'换一批邀请':'看看其他可能'} ↻</button><button class="primary" data-jaction="commit" ${canCommitJourney()?'':'disabled'}>${commitCaption()} <span>→</span></button></div>${q.word?`<div class="story-lexicon"><strong>${esc(q.word.term)}</strong><span>${esc(q.word.meaning)}</span></div>`:''}`}</div>${storySidebar()}</section>`;if(b.mode==='call'&&journey.phase==='scene'){if(!journey.callStarted){journey.callStarted=Date.now();keepJourney()}journeyClock=setInterval(()=>{const e=document.getElementById('journey-call-clock');if(!e)return;const seconds=Math.floor((Date.now()-journey.callStarted)/1000);e.textContent=seconds<30?'通话等待 '+String(seconds).padStart(2,'0')+' 秒 · 你可以重排日程':'通话窗口已延长，从容决定即可';},1000)}}
function commitJourney(){if(!canCommitJourney())return;const n=journey.step,mode=BEATS[n].mode;let primary=journey.selected,extra=[];if(mode==='schedule'){const ids=journey.schedule.filter(i=>i>=0);primary=ids[0];extra=ids.slice(1)}if(mode==='seating'){primary=journey.guests[0];extra=journey.guests.slice(1)}if(mode==='schedule')journey.restCount=journey.schedule.filter(i=>i===-1).length;if(mode==='call')journey.quickCall=Date.now()-journey.callStarted<30000;journey.picks[n]=primary;journey.extras[n]=extra;const o=Q[n].options[primary];journey.log[n]={label:mode==='seating'?journey.guests.map(i=>Q[n].options[i].label).join(' · '):mode==='schedule'?journey.schedule.map(i=>i===-1?'留白':Q[n].options[i].label).join(' / '):o.label,tag:journeyTag(o)};journey.phase='aftermath';keepJourney();clearStoryClock();renderJourney();scrollPage(0,true)}
function continueJourney(){if(journey.step===11){journey.phase='complete';keepJourney();go('result');return}journey.step++;journey.phase='scene';journey.selected=Number.isInteger(journey.picks[journey.step])?journey.picks[journey.step]:null;journey.pendingTask=null;if(journey.step===8)journey.callStarted=null;keepJourney();go('journey')}
function redrawJourney(){const n=journey.step,current=questionDraw(n);let remaining=questionQueues[n]||[];if(remaining.length<4)remaining=shuffleIds(Q[n].options.map((o,i)=>i).filter(i=>!current.includes(i))).concat(shuffleIds(current));questionSets[n]=remaining.slice(0,4);questionQueues[n]=remaining.slice(4);persistDraws();journey.selected=null;journey.opened[n]=[];journey.pendingTask=null;if(BEATS[n].mode==='schedule')journey.schedule=[null,null,null];if(BEATS[n].mode==='seating')journey.guests=[];keepJourney();renderJourney()}
function assignStorySlot(slot,id){if(!Number.isInteger(id)||id<-1||!questionDraw(journey.step).includes(id)&&id!==-1)return;const old=journey.schedule[slot],from=id===-1?-1:journey.schedule.indexOf(id);journey.schedule[slot]=id;if(from>=0&&from!==slot)journey.schedule[from]=old;keepJourney();renderJourney()}
function stopAmbience(){if(!ambience)return;ambience.stop();ambience=null}
function toggleAmbience(){if(ambience){stopAmbience();renderJourney();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('当前浏览器暂不支持氛围音');return}try{const ctx=new AC(),gain=ctx.createGain();gain.gain.value=.008;gain.connect(ctx.destination);const oscillators=[130.81,164.81,196,246.94].map((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=i%2?3:-3;o.connect(gain);o.start();return o});ctx.resume();ambience={stop(){oscillators.forEach(o=>o.stop());ctx.close()}};renderJourney()}catch(error){toast('氛围音暂未开启，可继续体验故事')}}
function journeyBadge(){const t=topTaste()[0];return {quant:'安静的掌舵人',business:'从容的行程家',privacy:'边界清楚的旅人',culture:'慢游收藏家',gastronomy:'餐桌上的漫游者',wellness:'找回节奏的人',social:'有分寸的东道主',romance:'两人时光收藏家',family:'把日常带在身边的人',nature:'山海之间的旅人',design:'空间与光线的观察者',legacy:'经典的回访者'}[t]||'把时间留给自己的旅人'}
renderResult=function(){classicResult();if(!journey||!journey.active||!isComplete()||view!=='result')return;const title=journey.title.trim()||journeyBadge();app.querySelector('.page').insertAdjacentHTML('afterbegin',`<section class="journey-epilogue"><div class="eyebrow">YOUR THREE-DAY JOURNAL</div><h2>${esc(title)}</h2><p>${journeyBadge()} · 十二个片刻，成为一份只属于你的酒店手札。</p><div class="epilogue-stamps"><span>✦ ARRIVAL</span><span>✦ THE TABLE</span><span>✦ MEMORIES</span>${journey.quickCall?'<span>✦ 临场从容</span>':''}</div>${storyMeters()}<div class="journal-recap">${[2,4,7,9].map(n=>`<div><time>DAY 0${BEATS[n].day} · ${BEATS[n].time}</time><strong>${esc(journey.log[n]&&journey.log[n].label||Q[n].options[answers[n]].label)}</strong><button class="text-btn" data-jaction="jump" data-stage="${n}">调整这一段 ↗</button></div>`).join('')}</div><button class="text-btn" data-jaction="start">开启另一段三天行程 ↗</button></section>`)};
document.addEventListener('click',e=>{const target=e.target.closest('[data-jaction]');if(!target)return;e.preventDefault();e.stopPropagation();const action=target.dataset.jaction,id=Number(target.dataset.option);if(action==='start'){stopAmbience();startJourney();return}if(action==='resume'){resumeJourney();return}if(action==='mood'){config.scope=target.dataset.storyMood==='privacy'?'世界':'全部';storage.set('config',config);go('journey-setup');return}if(!journey)return;if(action==='select'){journey.selected=id;keepJourney();renderJourney()}else if(action==='reveal'){const opened=storyRead(journey.step);if(!opened.includes(id))opened.push(id);journey.opened[journey.step]=opened;keepJourney();renderJourney()}else if(action==='task'){journey.pendingTask=id;keepJourney();renderJourney()}else if(action==='slot'){if(journey.pendingTask===null){toast('先选一张活动卡，再放进时间格');return}assignStorySlot(Number(target.dataset.slot),journey.pendingTask)}else if(action==='draft'){const ids=questionDraw(journey.step);journey.schedule=[ids[0],-1,ids[1]];keepJourney();renderJourney()}else if(action==='guest'){if(journey.guests.includes(id))journey.guests=journey.guests.filter(i=>i!==id);else if(journey.guests.length<2)journey.guests.push(id);else{toast('餐桌保留两席，先收回一位来宾的邀请');return}keepJourney();renderJourney()}else if(action==='commit'){commitJourney()}else if(action==='continue'){continueJourney()}else if(action==='return-result'){journey.phase='complete';keepJourney();go('result')}else if(action==='edit'){journey.phase='scene';journey.selected=journey.picks[journey.step];keepJourney();renderJourney()}else if(action==='redraw'){redrawJourney()}else if(action==='jump'){const n=Number(target.dataset.stage);if(n>journey.step&&!Number.isInteger(journey.picks[n]))return;journey.step=n;journey.phase='scene';journey.selected=Number.isInteger(journey.picks[n])?journey.picks[n]:null;keepJourney();go('journey')}else if(action==='pause'){keepJourney();stopAmbience();go('home');toast('三天行程已保存，随时回来继续')}else if(action==='sound'){toggleAmbience()}},true);
document.addEventListener('input',e=>{if(e.target.id==='journey-title'&&journey){journey.title=e.target.value.slice(0,24);keepJourney()}});
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-task]');if(t&&view==='journey'){e.dataTransfer.setData('text/plain',t.dataset.task);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(view==='journey'&&e.target.closest('[data-slot]'))e.preventDefault()});
document.addEventListener('drop',e=>{const slot=e.target.closest('[data-slot]');if(!slot||view!=='journey')return;e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(/^-?\d+$/.test(raw))assignStorySlot(Number(slot.dataset.slot),Number(raw))});
window.addEventListener('pagehide',stopAmbience);
go('home');
</script></body></html>
